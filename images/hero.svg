<?xml version="1.0" encoding="UTF-8"?>
<!-- hero.svg: lightweight, professional hero illustration placeholder -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">She Can Foundation hero illustration</title>
  <desc id="desc">Stylized illustration of people collaborating, in deep purple and soft lavender.</desc>
  <rect width="100%" height="100%" fill="#EDE7F6"/>
  <!-- soft purple circle -->
  <circle cx="920" cy="120" r="110" fill="#5B3E96" opacity="0.12" />
  <!-- abstract group (three figures) -->
  <g transform="translate(160,180)">
    <!-- figure 1 -->
    <ellipse cx="80" cy="60" rx="40" ry="48" fill="#5B3E96" opacity="0.14" />
    <rect x="50" y="110" width="60" height="110" rx="14" fill="#5B3E96" opacity="0.18" />
    <!-- figure 2 -->
    <ellipse cx="240" cy="40" rx="36" ry="44" fill="#5B3E96" opacity="0.22" />
    <rect x="210" y="84" width="60" height="130" rx="14" fill="#5B3E96" opacity="0.16" />
    <!-- figure 3 -->
    <ellipse cx="420" cy="74" rx="34" ry="40" fill="#5B3E96" opacity="0.18" />
    <rect x="390" y="114" width="58" height="100" rx="12" fill="#5B3E96" opacity="0.12" />
    <!-- connecting shape -->
    <path d="M30 260 C150 200, 330 200, 490 260" stroke="#5B3E96" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.08" />
  </g>
</svg>