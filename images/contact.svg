<?xml version="1.0" encoding="UTF-8"?>
<!-- contact.svg: contact / communication placeholder -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="ct ct-desc">
  <title id="ct">Contact illustration</title>
  <desc id="ct-desc">Envelope and phone icon illustration in site colors.</desc>
  <rect width="100%" height="100%" fill="#fff" />
  <g transform="translate(80,60)">
    <rect x="0" y="0" width="240" height="140" rx="14" fill="#EDE7F6" />
    <polyline points="0,0 120,80 240,0" fill="#5B3E96" opacity="0.08" />
    <rect x="320" y="20" width="160" height="120" rx="10" fill="#f9f7fb" stroke="#5B3E96" stroke-opacity="0.06" />
    <circle cx="400" cy="80" r="16" fill="#5B3E96" opacity="0.12" />
  </g>
  <text x="80" y="260" fill="#5B3E96" font-size="16">Contact — we're here to help</text>
</svg>